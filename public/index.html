<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Technical Support AI | Internal Team</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container">
        <h1>Internal Tech Support</h1>
        <div id="chat-box" class="chat-box">
            <div class="message bot">Halo! Saya adalah Technical Support Specialist internal. Ada yang bisa saya bantu
                terkait kendala teknis atau troubleshooting sistem hari ini?</div>
        </div>
        <form id="chat-form">
            <input type="text" id="user-input" placeholder="Tanyakan sesuatu pada mentor..." autocomplete="off"
                required />
            <button type="submit" id="send-btn">Kirim</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>

</html>
